services:
  backend:
    build: {context: ., dockerfile: Dockerfile.backend}
    ports: ["8000:8000"]
    environment:
      MATH_ASSISTANT_BASE_MODEL: ${MATH_ASSISTANT_BASE_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
      MATH_ASSISTANT_BASE_REVISION: ${MATH_ASSISTANT_BASE_REVISION:-7ae557604adf67be50417f59c2c2f167def9a775}
      MATH_ASSISTANT_ADAPTER_PATH: ${MATH_ASSISTANT_ADAPTER_PATH:-/models/adapters/qwen-v2}
    volumes:
      - ./models/adapters:/models/adapters:ro
      - ${MATH_ASSISTANT_HF_CACHE:-./.hf-cache}:/root/.cache/huggingface
  frontend:
    build: {context: ., dockerfile: Dockerfile.frontend}
    ports: ["8080:80"]
    depends_on: [backend]
  prometheus:
    image: prom/prometheus:v3.0.0
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.4.0
    ports: ["3000:3000"]
    volumes: ["./monitoring/grafana:/etc/grafana/provisioning:ro"]
