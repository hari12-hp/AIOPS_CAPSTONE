server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend backend:8000;
    proxy_connect_timeout 5s;
    proxy_read_timeout 190s;

    location = /pipeline.html { return 302 http://$host:8081/; }
    location = /pipeline { return 302 http://$host:8081/; }
    location = /health { proxy_pass http://$api_backend$request_uri; }
    location /v1/ { proxy_pass http://$api_backend$request_uri; }
    location /metrics { proxy_pass http://$api_backend$request_uri; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 81;
    server_name _;
    root /usr/share/nginx/html;
    index pipeline.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend backend:8000;
    proxy_connect_timeout 5s;
    proxy_read_timeout 190s;

    location = / { try_files /pipeline.html =404; }
    location = /index.html { return 302 http://$host:8080/; }
    location = /help.html { return 302 http://$host:8080/help.html; }
    location = /health { proxy_pass http://$api_backend$request_uri; }
    location /v1/ { proxy_pass http://$api_backend$request_uri; }
    location /metrics { proxy_pass http://$api_backend$request_uri; }
    location / { try_files $uri =404; }
}
