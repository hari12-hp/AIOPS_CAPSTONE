server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health { proxy_pass http://backend:8000/health; }
    location /v1/ { proxy_pass http://backend:8000; }
    location /metrics { proxy_pass http://backend:8000; }
    location / { try_files $uri $uri/ /index.html; }
}
