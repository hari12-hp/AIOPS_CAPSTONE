stages:
  inspect_and_ingest:
    cmd: .venv/bin/python -m src.data.inspect_dataset
    deps: [src/data/inspect_dataset.py, artifacts/input/pilot-v1]
    outs: [reports/runtime/environment.json]
  ingest_dataset:
    cmd: .venv/bin/python -m src.data.ingest_dataset --revision 1b05109f9e5c1ad06c0663519502416c30b300f8 --scan-limit 4000 --target 800
    deps: [src/data/ingest_dataset.py, configs/data.yaml]
    outs: [data/raw/numinamath.jsonl, reports/eda/ingestion.json]
  eda:
    cmd: .venv/bin/python -m src.data.eda data/raw/numinamath.jsonl
    deps: [src/data/eda.py, data/raw/numinamath.jsonl]
    outs: [reports/eda/report.json, reports/eda/sample_review.json]
  clean_with_pyspark:
    cmd: .venv/bin/python -m src.data.clean_with_spark data/raw/numinamath.jsonl
    deps: [src/data/clean_with_spark.py, data/raw/numinamath.jsonl]
    outs: [data/cleaned/records, reports/eda/quality.json]
  split_and_validate:
    cmd: .venv/bin/python -m src.data.split_dataset data/cleaned/records/part-*.json
    deps: [src/data/split_dataset.py, data/cleaned/records]
    outs: [data/splits, reports/eda/splits.json]
  cpu_benchmark:
    cmd: .venv/bin/python -m src.training.train_lora_cpu --model google/gemma-3-1b-it --revision dcc83ea841ab6100d6b47a070329e1ba4cf78752 --output models/adapters/gemma-v2 --benchmark-steps 3 --benchmark-report reports/runtime/gemma_benchmark.json --max-rss-gib 8
    deps: [src/training/train_lora_cpu.py, data/splits/train.jsonl]
    outs: [reports/runtime/gemma_benchmark.json]
  train_gemma_cpu_v2:
    cmd: .venv/bin/python -m src.training.train_lora_cpu --model google/gemma-3-1b-it --revision dcc83ea841ab6100d6b47a070329e1ba4cf78752 --train-data data/splits/train.jsonl --output models/adapters/gemma-v2 --max-length 256 --threads 6 --epochs 1 --learning-rate 5e-5 --train
    deps: [src/training/train_lora_cpu.py, configs/train_gemma_v2.yaml, data/splits/train.jsonl]
    frozen: true
  evaluate_gemma_v2:
    cmd: .venv/bin/python -m src.training.evaluate_models --model google/gemma-3-1b-it --revision dcc83ea841ab6100d6b47a070329e1ba4cf78752 --adapter models/adapters/gemma-v2 --test-data data/splits/test.jsonl --max-length 256 --output reports/evaluation/gemma_v2.json
    deps: [src/training/evaluate_models.py, data/splits/test.jsonl, models/adapters/gemma-v2]
    frozen: true
