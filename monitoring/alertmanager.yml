global:
  resolve_timeout: 2m
route:
  receiver: local-inbox
  group_by: [alertname, component, service, stage]
  group_wait: 15s
  group_interval: 30s
  repeat_interval: 4h
  routes:
    - matchers: ['alertname="Watchdog"']
      receiver: heartbeat
      group_wait: 0s
      group_interval: 30s
      repeat_interval: 1m
    - matchers: ['alertname="AlertDeliveryDrill"']
      receiver: local-inbox
      group_wait: 0s
      group_interval: 15s
      repeat_interval: 5m
    - matchers: ['severity="critical"']
      receiver: local-inbox
      group_wait: 5s
      repeat_interval: 1h
receivers:
  - name: local-inbox
    webhook_configs:
      - url: http://alert-receiver:9199/alerts
        send_resolved: true
        max_alerts: 100
  - name: heartbeat
    webhook_configs:
      - url: http://alert-receiver:9199/alerts
        send_resolved: false
        max_alerts: 100
inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [component]
  - source_matchers: ['alertname="MathTargetUnavailable"']
    target_matchers: ['alertname="MathEndpointUnavailable"']
    equal: [component]
